<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><title>TV Remote</title>
<style>
:root{--bg:#1c2033;--key:#2a3050;--hi:#3d4675;--ink:#ece6dc;--dim:#9aa0bd;--go:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 16px/1.2 ui-rounded,"Avenir Next",system-ui,sans-serif}
main{max-width:420px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:grid;gap:18px}
button{font:inherit;color:inherit;border:0;background:var(--key);border-radius:16px;min-height:52px;transition:transform .08s,background .08s}
button:active{transform:scale(.94);background:var(--hi)}
button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.ring{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:4px auto;border-radius:50%;background:var(--key);box-shadow:inset 0 0 0 10px var(--bg)}
.ring button{position:absolute;background:transparent;border-radius:50%;width:34%;height:34%;font-size:26px;color:var(--dim)}
.ring button:active{background:var(--hi);color:var(--ink)}
.u{top:6%;left:33%}.d{bottom:6%;left:33%}.l{left:6%;top:33%}.r{right:6%;top:33%}
.ring .ok{inset:33%;width:34%;height:34%;background:var(--go);color:#2b2308;font-size:20px;border-radius:50%}
.ring .ok:active{background:#ffd878;color:#2b2308}
#pad{height:150px;border-radius:20px;background:var(--key);display:grid;place-items:center;color:var(--dim);touch-action:none}
.vol{grid-template-columns:1fr 1fr 1fr}
input{width:100%;min-height:52px;border:0;border-radius:16px;background:var(--key);color:var(--ink);padding:0 16px;font:inherit;user-select:text;-webkit-user-select:text}
#st{text-align:center;color:var(--dim);font-size:13px;min-height:16px}
</style></head><body><main>
<div class="row"><button data-k="back">Back</button><button data-k="home">Home</button><button data-k="recents">Apps</button></div>
<div class="ring">
<button class="u" data-k="up" aria-label="Up">&#9650;</button><button class="l" data-k="left" aria-label="Left">&#9664;</button>
<button class="ok" data-k="ok">OK</button>
<button class="r" data-k="right" aria-label="Right">&#9654;</button><button class="d" data-k="down" aria-label="Down">&#9660;</button>
</div>
<div class="row vol"><button data-k="voldown">Vol &minus;</button><button data-k="mute">Mute</button><button data-k="volup">Vol +</button></div>
<div id="pad">Touchpad: tap or swipe, it maps to the TV screen</div>
<input id="t" placeholder="Type here, it goes to the focused field" enterkeyhint="send" autocomplete="off">
<div id="st"></div>
</main>
<script>
const st=document.getElementById('st');
const send=async u=>{try{await fetch(u);st.textContent=''}catch(e){st.textContent='Lost the TV. Check Wi-Fi and the TV app.'}};
document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{send('/k?c='+b.dataset.k);navigator.vibrate&&navigator.vibrate(8)}));
const pad=document.getElementById('pad');let s0;
const pos=t=>{const r=pad.getBoundingClientRect();return[(t.clientX-r.left)/r.width,(t.clientY-r.top)/r.height]};
pad.addEventListener('touchstart',e=>{s0=pos(e.touches[0])});
pad.addEventListener('touchend',e=>{const a=s0,b=pos(e.changedTouches[0]);
 if(Math.hypot(b[0]-a[0],b[1]-a[1])<.04)send(`/tap?x=${b[0]}&y=${b[1]}`);
 else send(`/swipe?x1=${a[0]}&y1=${a[1]}&x2=${b[0]}&y2=${b[1]}`)});
const t=document.getElementById('t');
t.addEventListener('keydown',e=>{if(e.key==='Enter'){send('/text?t='+encodeURIComponent(t.value))}});
t.addEventListener('input',()=>send('/text?t='+encodeURIComponent(t.value)));
</script></body></html>
